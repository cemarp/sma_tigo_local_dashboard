version: '3.8'

services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python3 main.py

  scraper:
    build: .
    volumes:
      - .:/app
    environment:
      - INVERTER_IP=${INVERTER_IP}
      - INVERTER_PASSWORD=${INVERTER_PASSWORD}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-5}
    command: python3 scraper.py
