<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV System Overview</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- GridStack.js -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
    <style>
        .module-grid {
            display: grid;
            gap: 0.5rem;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        }
        .module {
            aspect-ratio: 2/3;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            background-color: #1e40af;
            color: white;
            position: relative;
        }
        .module-value {
            font-weight: bold;
        }
        .grid-stack {
            background-color: #f3f4f6;
            padding: 10px;
            border-radius: 0.5rem;
            min-height: 400px;
        }
        .grid-stack-item-content {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 0.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-container {
            width: 200px;
            min-width: 200px;
            border-left: 1px solid #e5e7eb;
            background-color: #f9fafb;
            padding: 0.5rem;
            overflow-y: auto;
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        .chart-wrapper {
            flex-grow: 1;
            min-height: 0;
            position: relative;
            width: 100%;
        }
        .drag-handle {
            cursor: move;
            background-color: #f9fafb;
            border-bottom: 1px solid #f3f4f6;
            margin: -0.5rem -0.5rem 0.5rem -0.5rem;
            padding: 0.25rem;
            text-align: center;
            font-weight: bold;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-[1600px] mx-auto space-y-6">
        <header class="flex justify-between items-center bg-white p-4 rounded shadow">
            <h1 class="text-2xl font-bold">PV System Overview | Complete PV system</h1>
            <div class="flex items-center space-x-4">
                <div id="live-indicator" class="hidden flex items-center text-green-600 text-sm font-bold">
                    <span class="relative flex h-3 w-3 mr-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    LIVE
                </div>
                <div id="last-update" class="text-sm text-gray-500">Last update: --:--:--</div>
            </div>
        </header>

        <div class="bg-white p-4 rounded shadow">
            <div class="flex flex-wrap gap-4 mb-4 items-center">
                <div class="flex items-center space-x-2">
                    <label for="date-select" class="font-bold">Start Date:</label>
                    <input type="date" id="date-select" class="border rounded p-1">
                </div>
                <div class="flex items-center space-x-2">
                    <label for="days-select" class="font-bold">Duration:</label>
                    <select id="days-select" class="border rounded p-1">
                        <option value="1">1 Day</option>
                        <option value="2">2 Days</option>
                        <option value="3">3 Days</option>
                        <option value="4">4 Days</option>
                        <option value="5">5 Days</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="live-toggle" class="form-checkbox h-4 w-4">
                    <label for="live-toggle" class="text-sm">Auto-Refresh (Live)</label>
                </div>
            </div>

            <!-- Movable Dashboard Area -->
            <div class="grid-stack">
                <!-- Top System Charts -->
                <div class="grid-stack-item" gs-w="4" gs-h="4">
                    <div class="grid-stack-item-content">
                        <div class="drag-handle">Power Analysis (W)</div>
                        <div class="chart-wrapper"><canvas id="power-chart"></canvas></div>
                    </div>
                </div>
                <div class="grid-stack-item" gs-w="4" gs-h="4">
                    <div class="grid-stack-item-content">
                        <div class="drag-handle">String Voltages (V)</div>
                        <div class="chart-wrapper"><canvas id="voltage-chart"></canvas></div>
                    </div>
                </div>
                <div class="grid-stack-item" gs-w="4" gs-h="4">
                    <div class="grid-stack-item-content">
                        <div class="drag-handle">String Currents (A)</div>
                        <div class="chart-wrapper"><canvas id="current-chart"></canvas></div>
                    </div>
                </div>

                <!-- Module History Charts -->
                <div class="grid-stack-item" gs-w="12" gs-h="6">
                    <div class="grid-stack-item-content">
                        <div class="drag-handle">Module Power (W)</div>
                        <div class="flex flex-1 min-h-0">
                            <div class="flex-1 min-w-0 relative">
                                <canvas id="module-power-history-chart"></canvas>
                            </div>
                            <div class="sidebar-container" id="module-power-history-sidebar"></div>
                        </div>
                    </div>
                </div>
                <div class="grid-stack-item" gs-w="12" gs-h="6">
                    <div class="grid-stack-item-content">
                        <div class="drag-handle">Module Voltage (V)</div>
                        <div class="flex flex-1 min-h-0">
                            <div class="flex-1 min-w-0 relative">
                                <canvas id="module-voltage-history-chart"></canvas>
                            </div>
                            <div class="sidebar-container" id="module-voltage-history-sidebar"></div>
                        </div>
                    </div>
                </div>
                <div class="grid-stack-item" gs-w="12" gs-h="6">
                    <div class="grid-stack-item-content">
                        <div class="drag-handle">Module Temperature (°C)</div>
                        <div class="flex flex-1 min-h-0">
                            <div class="flex-1 min-w-0 relative">
                                <canvas id="module-temp-history-chart"></canvas>
                            </div>
                            <div class="sidebar-container" id="module-temp-history-sidebar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Static Module Display and Scrubber -->
            <div class="border-t pt-4 mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Module Level Display</h2>
                    <div class="flex items-center space-x-2">
                        <label for="metric-select" class="font-bold text-sm">Metric:</label>
                        <select id="metric-select" class="border rounded p-1 text-sm">
                            <!-- Options will be populated from config -->
                        </select>
                    </div>
                </div>
                <div id="module-display" class="space-y-4">
                    <!-- Strings and Modules will be rendered here -->
                </div>
            </div>

            <!-- Time Scrubber -->
            <div class="mt-8 bg-gray-50 p-4 rounded border">
                <input type="range" id="time-scrubber" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" min="0" max="0" step="1">
                <div id="scrubber-time" class="text-center font-bold mt-2 text-lg">--:--:--</div>
            </div>
        </div>
    </div>

    <script>
        let config = null;
        let dailyData = [];
        let timestamps = [];
        let charts = {};
        let selectedMetricId = 'power';
        let refreshInterval = null;
        let grid = null;

        async function init() {
            console.log("Initializing Dashboard...");
            if (typeof GridStack === 'undefined') {
                console.error("GridStack not loaded!");
                return;
            }

            // Initialize GridStack
            grid = GridStack.init({
                cellHeight: 80,
                margin: 10,
                handle: '.drag-handle'
            });

            // Re-render charts on resize
            grid.on('resizestop', function(event, el) {
                const canvas = el.querySelector('canvas');
                if (canvas && charts[canvas.id]) {
                    charts[canvas.id].resize();
                }
            });

            // Guarded ResizeObservers to prevent jittering during interaction
            document.querySelectorAll('.grid-stack-item-content').forEach(container => {
                let lastWidth = container.clientWidth;
                let lastHeight = container.clientHeight;
                new ResizeObserver(() => {
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    if (Math.abs(width - lastWidth) > 1 || Math.abs(height - lastHeight) > 1) {
                        lastWidth = width;
                        lastHeight = height;
                        const canvas = container.querySelector('canvas');
                        if (canvas && charts[canvas.id]) {
                            charts[canvas.id].resize();
                        }
                    }
                }).observe(container);
            });

            const configRes = await fetch('/config');
            config = await configRes.json();

            // Populate metric selector
            const metricSelect = document.getElementById('metric-select');
            config.metrics.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                metricSelect.appendChild(opt);
            });
            metricSelect.value = selectedMetricId;
            metricSelect.addEventListener('change', (e) => {
                selectedMetricId = e.target.value;
                updateDisplay();
            });

            // Set default date
            const dateInput = document.getElementById('date-select');
            const daysSelect = document.getElementById('days-select');
            const now = new Date();
            dateInput.value = now.toISOString().split('T')[0];

            dateInput.addEventListener('change', loadData);
            daysSelect.addEventListener('change', loadData);

            document.getElementById('live-toggle').addEventListener('change', (e) => {
                if (e.target.checked) {
                    startLiveRefresh();
                } else {
                    stopLiveRefresh();
                }
            });

            await loadData();

            document.getElementById('time-scrubber').addEventListener('input', (e) => {
                updateScrubber(parseInt(e.target.value));
            });
            console.log("Initialization complete.");
        }

        function startLiveRefresh() {
            document.getElementById('live-indicator').classList.remove('hidden');
            refreshInterval = setInterval(loadData, 30000);
        }

        function stopLiveRefresh() {
            document.getElementById('live-indicator').classList.add('hidden');
            if (refreshInterval) clearInterval(refreshInterval);
        }

        async function loadData() {
            const date = document.getElementById('date-select').value;
            const days = document.getElementById('days-select').value;
            const res = await fetch(`/data/daily?date=${date}&days=${days}`);
            const rawData = await res.json();

            const grouped = {};
            rawData.forEach(r => {
                if (!grouped[r.timestamp]) {
                    grouped[r.timestamp] = [];
                }
                grouped[r.timestamp].push(r);
            });

            const newTimestamps = Object.keys(grouped).sort();
            if (newTimestamps.length === 0) {
                // Clear charts if no data
                updateCharts();
                updateDisplay();
                return;
            }

            const scrubber = document.getElementById('time-scrubber');
            const isAtEnd = parseInt(scrubber.value) === timestamps.length - 1;

            timestamps = newTimestamps;
            dailyData = timestamps.map(ts => grouped[ts]);

            scrubber.max = timestamps.length - 1;

            if (isAtEnd || timestamps.length === 1 || scrubber.value > scrubber.max) {
                scrubber.value = timestamps.length - 1;
                updateScrubber(timestamps.length - 1);
            } else {
                updateDisplay();
            }

            updateCharts();

            if (timestamps.length > 0) {
                document.getElementById('last-update').textContent = `Last update: ${new Date(timestamps[timestamps.length-1]).toLocaleString()}`;
            }
        }

        function updateCharts() {
            if (!config) return;
            // 1. Power Chart
            const powerDatasets = [
                {
                    label: 'Inverter AC (W)',
                    data: timestamps.map((ts, i) => ({
                        x: new Date(ts),
                        y: parseFloat(dailyData[i].find(r => r.category.includes('AC Side') && r.parameter.includes(config.inverter_power.parameter))?.value || 0)
                    })),
                    borderColor: '#3b82f6',
                    tension: 0.1,
                    borderWidth: 2
                },
                {
                    label: 'Module DC Sum (W)',
                    data: timestamps.map((ts, i) => {
                        const powerMetric = config.metrics.find(m => m.id === 'power');
                        const sum = dailyData[i]
                            .filter(r => r.category === powerMetric.scraper_category && r.parameter.toLowerCase().includes(powerMetric.scraper_param.toLowerCase()) && r.parameter.includes('#'))
                            .reduce((acc, r) => acc + parseFloat(r.value || 0), 0);
                        return { x: new Date(ts), y: sum };
                    }),
                    borderColor: '#ef4444',
                    tension: 0.1,
                    borderWidth: 2
                }
            ];

            config.strings.forEach((s, idx) => {
                const colors = ['#10b981', '#f59e0b', '#8b5cf6'];
                powerDatasets.push({
                    label: `${s.name} (W)`,
                    data: timestamps.map((ts, i) => ({
                        x: new Date(ts),
                        y: parseFloat(dailyData[i].find(r => r.category === s.dc_metrics.power.category && r.parameter.includes(s.dc_metrics.power.parameter))?.value || 0)
                    })),
                    borderColor: colors[idx % colors.length],
                    borderDash: [5, 5],
                    tension: 0.1,
                    borderWidth: 1.5
                });
            });
            renderChart('power-chart', powerDatasets, 'Power (W)');

            // 2. Voltage Chart
            const voltageDatasets = config.strings.map((s, idx) => {
                const colors = ['#10b981', '#f59e0b', '#8b5cf6'];
                return {
                    label: `${s.name} (V)`,
                    data: timestamps.map((ts, i) => ({
                        x: new Date(ts),
                        y: parseFloat(dailyData[i].find(r => r.category === s.dc_metrics.voltage.category && r.parameter.includes(s.dc_metrics.voltage.parameter))?.value || 0)
                    })),
                    borderColor: colors[idx % colors.length],
                    tension: 0.1
                };
            });
            renderChart('voltage-chart', voltageDatasets, 'Voltage (V)');

            // 3. Current Chart
            const currentDatasets = config.strings.map((s, idx) => {
                const colors = ['#10b981', '#f59e0b', '#8b5cf6'];
                return {
                    label: `${s.name} (A)`,
                    data: timestamps.map((ts, i) => ({
                        x: new Date(ts),
                        y: parseFloat(dailyData[i].find(r => r.category === s.dc_metrics.current.category && r.parameter.includes(s.dc_metrics.current.parameter))?.value || 0)
                    })),
                    borderColor: colors[idx % colors.length],
                    tension: 0.1
                };
            });
            renderChart('current-chart', currentDatasets, 'Current (A)');

            // Module History Charts
            updateModuleHistoryCharts();
        }

        function updateModuleHistoryCharts() {
            const metrics = [
                { id: 'power', canvasId: 'module-power-history-chart', title: 'Power (W)' },
                { id: 'voltage', canvasId: 'module-voltage-history-chart', title: 'Voltage (V)' },
                { id: 'temperature', canvasId: 'module-temp-history-chart', title: 'Temp (°C)' }
            ];

            metrics.forEach(mInfo => {
                const metric = config.metrics.find(m => m.id === mInfo.id);
                const datasets = [];

                config.strings.forEach(string => {
                    string.modules.forEach(modIdx => {
                        datasets.push({
                            label: `M#${modIdx}`,
                            data: timestamps.map((ts, i) => {
                                const m = dailyData[i].find(r => {
                                    if (r.category !== metric.scraper_category) return false;
                                    const paramLower = r.parameter.toLowerCase();
                                    const metricLower = metric.scraper_param.toLowerCase();
                                    if (!paramLower.includes(metricLower)) return false;
                                    const regex = new RegExp(`#${modIdx}(\\D|$)`);
                                    return regex.test(r.parameter);
                                });
                                return { x: new Date(ts), y: m ? parseFloat(m.value) : null };
                            }),
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1,
                            hidden: true
                        });
                    });
                });
                if (datasets.length > 0) {
                    for(let i=0; i<Math.min(5, datasets.length); i++) datasets[i].hidden = false;
                }

                renderChart(mInfo.canvasId, datasets, mInfo.title, false);
                buildSidebar(mInfo.canvasId, mInfo.canvasId.replace('-chart', '-sidebar'));
            });
        }

        function buildSidebar(canvasId, sidebarId) {
            const sidebar = document.getElementById(sidebarId);
            if (!sidebar) return;
            sidebar.innerHTML = '<div class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Trace Selection</div>';

            const chart = charts[canvasId];
            if (!chart) return;
            const datasets = chart.data.datasets;

            // Map module number to its dataset index in chart
            const modToDatasetIdx = {};
            let currentIdx = 0;
            config.strings.forEach(string => {
                string.modules.forEach(modIdx => {
                    modToDatasetIdx[modIdx] = currentIdx++;
                });
            });
            const containerDiv = document.createElement('div');
            containerDiv.className = 'space-y-3';
            let lastCheckedCheckbox = null;
            config.strings.forEach(string => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'border border-gray-200 rounded p-1.5 bg-white shadow-sm';
                // String Header Row (Collapsible & Group Clickable)
                const headerRow = document.createElement('div');
                headerRow.className = 'flex items-center justify-between hover:bg-gray-100 p-1 rounded cursor-pointer select-none';
                const leftSection = document.createElement('div');
                leftSection.className = 'flex items-center space-x-1.5';
                const expandBtn = document.createElement('span');
                expandBtn.className = 'expand-btn text-[10px] w-4 text-center font-bold text-gray-500';
                expandBtn.textContent = '▼';
                const stringCheckbox = document.createElement('input');
                stringCheckbox.type = 'checkbox';
                stringCheckbox.className = 'string-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'font-semibold text-gray-800 text-[11px]';
                titleSpan.textContent = string.name;
                leftSection.appendChild(expandBtn);
                leftSection.appendChild(stringCheckbox);
                leftSection.appendChild(titleSpan);
                const badge = document.createElement('span');
                badge.className = 'text-[9px] bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded-full count-badge font-medium';
                headerRow.appendChild(leftSection);
                headerRow.appendChild(badge);
                groupDiv.appendChild(headerRow);
                // Modules checkbox list
                const listDiv = document.createElement('div');
                listDiv.className = 'pl-5 pr-1 mt-1 space-y-1 modules-list';
                const checkboxes = [];
                string.modules.forEach(modIdx => {
                    const dsIdx = modToDatasetIdx[modIdx];
                    if (dsIdx === undefined) return;
                    const dataset = datasets[dsIdx];

                    const label = document.createElement('label');
                    label.className = 'flex items-center space-x-2 p-1 hover:bg-gray-50 rounded cursor-pointer select-none text-[11px]';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'module-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500';
                    cb.checked = !dataset.hidden;
                    cb.dataset.mod = modIdx;
                    cb.dataset.dsIdx = dsIdx;
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'text-gray-700';
                    nameSpan.textContent = `M#${modIdx}`;
                    // Small color block to match the Chart trace line!
                    const colorBlock = document.createElement('span');
                    colorBlock.className = 'w-3 h-1.5 rounded-sm inline-block';
                    colorBlock.style.backgroundColor = dataset.borderColor || '#ccc';
                    label.appendChild(cb);
                    label.appendChild(colorBlock);
                    label.appendChild(nameSpan);
                    listDiv.appendChild(label);
                    checkboxes.push(cb);
                    // ==========================================
                    // HOVER EFFECT: Highlight single module trace
                    // ==========================================
                    label.addEventListener('mouseenter', () => {
                        const idx = parseInt(cb.dataset.dsIdx);
                        const ds = datasets[idx];
                        if (ds.hidden) return; // Ignore if unchecked
                        if (!ds.originalBorderWidth) {
                            ds.originalBorderWidth = ds.borderWidth || 1.5;
                        }
                        ds.borderWidth = ds.originalBorderWidth + 3.0; // Thicken trace
                        chart.update('none');
                    });
                    label.addEventListener('mouseleave', () => {
                        const idx = parseInt(cb.dataset.dsIdx);
                        const ds = datasets[idx];
                        if (ds.originalBorderWidth !== undefined) {
                            ds.borderWidth = ds.originalBorderWidth; // Restore trace
                            chart.update('none');
                        }
                    });
                });
                groupDiv.appendChild(listDiv);
                containerDiv.appendChild(groupDiv);
                // Helper to update the String Header checkbox state & counts
                function updateHeaderState() {
                    const total = checkboxes.length;
                    const checkedCount = checkboxes.filter(c => c.checked).length;
                    badge.textContent = `${checkedCount}/${total}`;

                    if (checkedCount === total) {
                        stringCheckbox.checked = true;
                        stringCheckbox.indeterminate = false;
                    } else if (checkedCount === 0) {
                        stringCheckbox.checked = false;
                        stringCheckbox.indeterminate = false;
                    } else {
                        stringCheckbox.checked = false;
                        stringCheckbox.indeterminate = true;
                    }
                }
                updateHeaderState();
                // Collapse/Expand toggler on group row click
                const toggleExpand = (e) => {
                    if (e.target === stringCheckbox) return;
                    const isCollapsed = listDiv.classList.contains('hidden');
                    if (isCollapsed) {
                        listDiv.classList.remove('hidden');
                        expandBtn.textContent = '▼';
                    } else {
                        listDiv.classList.add('hidden');
                        expandBtn.textContent = '▶';
                    }
                };
                headerRow.addEventListener('click', toggleExpand);
                // ==========================================
                // HOVER EFFECT: Highlight entire String Group
                // ==========================================
                headerRow.addEventListener('mouseenter', (e) => {
                    if (e.target === stringCheckbox) return;
                    checkboxes.forEach(cb => {
                        if (!cb.checked) return;
                        const idx = parseInt(cb.dataset.dsIdx);
                        const ds = datasets[idx];
                        if (!ds.originalBorderWidth) {
                            ds.originalBorderWidth = ds.borderWidth || 1.5;
                        }
                        ds.borderWidth = ds.originalBorderWidth + 3.0; // Thicken all visible traces in group
                    });
                    chart.update('none');
                });
                headerRow.addEventListener('mouseleave', () => {
                    checkboxes.forEach(cb => {
                        const idx = parseInt(cb.dataset.dsIdx);
                        const ds = datasets[idx];
                        if (ds.originalBorderWidth !== undefined) {
                            ds.borderWidth = ds.originalBorderWidth;
                        }
                    });
                    chart.update('none');
                });
                // Click String checkbox -> Toggles all child module checkboxes
                stringCheckbox.addEventListener('change', () => {
                    const checked = stringCheckbox.checked;
                    checkboxes.forEach(cb => {
                        if (cb.checked !== checked) {
                            cb.checked = checked;
                            const dsIdx = parseInt(cb.dataset.dsIdx);
                            chart.data.datasets[dsIdx].hidden = !checked;
                        }
                    });
                    chart.update();
                    updateHeaderState();
                });
                // Click Module checkbox -> Supports SHIFT-CLICK range selection
                listDiv.addEventListener('click', (e) => {
                    if (e.target.type !== 'checkbox') return;
                    const clickedCb = e.target;
                    const dsIdx = parseInt(clickedCb.dataset.dsIdx);
                    chart.data.datasets[dsIdx].hidden = !clickedCb.checked;
                    if (e.shiftKey && lastCheckedCheckbox) {
                        const allCbs = Array.from(sidebar.querySelectorAll('.module-checkbox'));
                        const start = allCbs.indexOf(lastCheckedCheckbox);
                        const end = allCbs.indexOf(clickedCb);

                        if (start !== -1 && end !== -1) {
                            const [minIdx, maxIdx] = [Math.min(start, end), Math.max(start, end)];
                            const targetState = clickedCb.checked;

                            for (let i = minIdx; i <= maxIdx; i++) {
                                const targetCb = allCbs[i];
                                if (targetCb.checked !== targetState) {
                                    targetCb.checked = targetState;
                                    const targetDsIdx = parseInt(targetCb.dataset.dsIdx);
                                    chart.data.datasets[targetDsIdx].hidden = !targetState;
                                }
                            }
                        }
                    }
                    lastCheckedCheckbox = clickedCb;
                    chart.update();

                    // Sync all header states
                    sidebar.querySelectorAll('.string-checkbox').forEach(sc => {
                        if (sc.updateHeader) sc.updateHeader();
                    });
                });
                stringCheckbox.updateHeader = updateHeaderState;
            });
            sidebar.appendChild(containerDiv);
        }

        function renderChart(canvasId, datasets, yTitle, showLegend = true) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (charts[canvasId]) charts[canvasId].destroy();

            const isMultiDay = document.getElementById('days-select').value > 1;

            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    elements: { point: { radius: 0 } },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: isMultiDay ? 'day' : 'hour',
                                displayFormats: {
                                    day: 'MMM d',
                                    hour: 'HH:mm'
                                }
                            }
                        },
                        y: { beginAtZero: true, title: { display: true, text: yTitle } }
                    },
                    plugins: {
                        legend: {
                            display: showLegend,
                            position: 'bottom',
                            labels: {
                                boxWidth: 10,
                                font: { size: 10 },
                                usePointStyle: true
                            },
                            // Highlight trace on hover
                            onHover: (event, legendItem, legend) => {
                                const chart = legend.chart;
                                const dsIdx = legendItem.datasetIndex;
                                if (!chart.isDatasetVisible(dsIdx)) return;

                                chart.data.datasets.forEach((ds, idx) => {
                                    if (!ds.originalBorderWidth) {
                                        ds.originalBorderWidth = ds.borderWidth || 1.5;
                                    }
                                    if (idx === dsIdx) {
                                        ds.borderWidth = ds.originalBorderWidth + 3.0; // Highlight
                                    } else {
                                        ds.borderWidth = ds.originalBorderWidth;
                                    }
                                });
                                chart.update('none'); // Update immediately without animation reset
                            },
                            // Reset trace widths on cursor leave
                            onLeave: (event, legendItem, legend) => {
                                const chart = legend.chart;
                                chart.data.datasets.forEach((ds) => {
                                    if (ds.originalBorderWidth !== undefined) {
                                        ds.borderWidth = ds.originalBorderWidth; // Restore
                                    }
                                });
                                chart.update('none');
                            }
                        },
                        tooltip: {
                            intersect: false,
                            mode: 'index'
                        }
                    },
                    interaction: { intersect: false, mode: 'index' }
                }
            });
        }

        function updateScrubber(index) {
            if (index < 0 || index >= timestamps.length) return;
            updateDisplay(index);
        }

        function formatValue(val) {
            if (val === null || val === undefined || isNaN(val)) return '--';
            const num = parseFloat(val);
            if (num > 100) return num.toFixed(1);
            if (num > 10) return num.toFixed(2);
            return num.toFixed(3);
        }

        function updateDisplay(index = null) {
            if (!config) return;
            const scrubber = document.getElementById('time-scrubber');
            if (index === null) index = parseInt(scrubber.value);

            const container = document.getElementById('module-display');
            const timeDisplay = document.getElementById('scrubber-time');

            if (index < 0 || index >= timestamps.length) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">No data for selected period</div>';
                timeDisplay.textContent = '--:--:--';
                return;
            }

            // Update time display string
            const ts = timestamps[index];
            timeDisplay.textContent = new Date(ts).toLocaleString();

            const measurements = dailyData[index];
            container.innerHTML = '';

            const metric = config.metrics.find(m => m.id === selectedMetricId);

            config.strings.forEach(string => {
                const stringDiv = document.createElement('div');
                stringDiv.className = 'bg-gray-50 p-4 rounded border shadow-sm';
                stringDiv.innerHTML = `<h3 class="font-bold mb-3 text-lg border-b pb-1">${string.name}</h3>`;

                const gridDiv = document.createElement('div');
                gridDiv.className = 'module-grid';

                string.modules.forEach(modIdx => {
                    const m = measurements.find(r => {
                        if (r.category !== metric.scraper_category) return false;
                        const paramLower = r.parameter.toLowerCase();
                        const metricLower = metric.scraper_param.toLowerCase();
                        if (!paramLower.includes(metricLower)) return false;
                        const regex = new RegExp(`#${modIdx}(\\D|$)`);
                        return regex.test(r.parameter);
                    });

                    const modDiv = document.createElement('div');
                    modDiv.className = 'module rounded shadow-inner';
                    const displayValue = m ? formatValue(m.value) : '--';
                    modDiv.innerHTML = `
                        <div class="text-[10px] opacity-75">#${modIdx}</div>
                        <div class="module-value text-sm">${displayValue}</div>
                        <div class="text-[10px] opacity-75">${metric.unit}</div>
                    `;
                    gridDiv.appendChild(modDiv);
                });

                stringDiv.appendChild(gridDiv);
                container.appendChild(stringDiv);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
